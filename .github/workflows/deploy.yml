name: Deploy to S3 and CloudFront

on:
    push:
        branches:
            - develop

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION: ap-southeast-2

        steps:
            - name: Checkout source code
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Create .env file
              run: |
                  echo "VITE_TOSS_CLIENT_KEY=${{ secrets.VITE_TOSS_CLIENT_KEY }}" >> .env
                  echo "VITE_FASTAPI_URL=${{ secrets.VITE_FASTAPI_URL }}" >> .env
                  echo "VITE_BUSINESS_API_KEY=${{ secrets.VITE_BUSINESS_API_KEY }}" >> .env
                  echo "VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}" >> .env
                  echo "VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}" >> .env
                  echo "VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}" >> .env
                  echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env

            - name: Install dependencies
              run: npm install

            - name: Build React app
              run: npm run build

            - name: Deploy to S3
              run: |
                  aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
                    --paths "/*"